<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Pedro Sacheti - Cloud & Backend Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #1a1b26;
        }
        .terminal-window {
            background-color: #24283b;
            border: 1px solid #414868;
        }
        .terminal-header {
            background-color: #1f2335;
        }
        .prompt > span.user {
            color: #7aa2f7;
        }
        .prompt > span.arrow {
            color: #bb9af7;
        }
        .command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #c0caf5;
            flex-grow: 1;
            padding-left: 0.5rem;
        }
        .output {
            color: #a9b1d6;
        }
        .output .highlight {
            color: #e0af68;
        }
        .output .command-help {
            color: #7dcfff;
            font-weight: 500;
        }
        .output a {
            color: #7dcfff;
            text-decoration: none;
        }
        .output a:hover {
            text-decoration: underline;
        }
        .command-input:focus {
            box-shadow: none;
            outline: none;
        }
        .cursor {
            display: inline-block;
            background-color: #c0caf5;
            width: 10px;
            height: 1.2em;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #c0caf5; }
        }
    </style>
</head>
<body class="text-white p-4 sm:p-8 flex items-center justify-center min-h-screen">

    <div class="terminal-window rounded-lg shadow-2xl w-full max-w-4xl font-mono" onclick="document.getElementById('command-input').focus()">
        <div class="terminal-header flex items-center p-3 rounded-t-lg">
            <div class="flex space-x-2">
                <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
                <div class="w-3 h-3 bg-green-500 rounded-full"></div>
            </div>
            <div class="flex-grow text-center text-sm text-gray-400">jpsacheti@dev: ~</div>
        </div>

        <div id="terminal-body" class="p-4 sm:p-6 h-[75vh] overflow-y-auto text-sm sm:text-base">
            <div id="history"></div>
            <div id="interactive-prompt" class="prompt items-center" style="display: none;">
                <span class="user">jpsacheti@dev</span><span class="text-gray-500">:</span><span class="text-blue-400">~</span><span class="arrow font-bold mx-1">$</span>
                <input type="text" id="command-input" class="command-input w-full" autocomplete="off" />
            </div>
        </div>
    </div>

    <script>
        const terminalBody = document.getElementById('terminal-body');
        const historyContainer = document.getElementById('history');
        const interactivePrompt = document.getElementById('interactive-prompt');
        const input = document.getElementById('command-input');
        
        const user = "jpsacheti";
        const machine = "dev";
        let commandHistory = [];
        let historyIndex = -1;

        const commands = {
            'help': `
                <p class="mb-2">Welcome! This is my interactive portfolio. Commands are being run automatically.</p>
                <p>You will be able to type your own commands soon. Available commands are:</p>
                <p><span class="command-help">whoami</span>, <span class="command-help">ls -l skills</span>, <span class="command-help">cat experience.log</span>, <span class="command-help">cat certifications.log</span>, <span class="command-help">echo $CONTACT</span>, <span class="command-help">clear</span></p>
            `,
            'whoami': `<p>Hey, I'm João Pedro Sacheti. I'm an experienced Cloud Engineer and Backend Developer with a strong background in microservices architecture and DevSecOps practices, specializing in AWS cloud technologies.</p>`,
            'ls -l skills': `
                <p>total 7</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  AWS Cloud Services (EC2, Lambda, RDS, EKS, MSK)</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  Containerization (Docker, Kubernetes)</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  Backend Development (Java, Spring Boot, Spring Stack)</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  DevSecOps Practices</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  API Design (OpenAPI, OAuth)</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  Databases (SQL, NoSQL)</p>
                <p><span class="highlight">-rw-r--r--</span> 1 ${user} staff  Agile Methodologies (Scrum, Kanban)</p>
            `,
            'cat experience.log': `
                <div class="mb-2"><p><span class="highlight">> Feb 2014 - Sep 2020</span> | <strong>Java Developer</strong> at <strong>Limasoftware</strong></p></div>
                <div class="mb-2"><p><span class="highlight">> 2020 - 2022</span> | <strong>Software Engineering Specialist</strong> at <strong>Accenture (Santander)</strong></p></div>
                <div class="mb-2"><p><span class="highlight">> 2022 - 2023</span> | <strong>Senior Software Developer</strong> at <strong>GFT Technologies (Santander)</strong></p></div>
                <div class="mb-2"><p><span class="highlight">> 2023 - Jun 2024</span> | <strong>Cloud Engineer</strong> at <strong>First Tecnologia e Inovação (Santander)</strong></p></div>
                <div><p><span class="highlight">> Jun 2024 - Present</span> | <strong>Specialist Backend Developer</strong> at <strong>Zup IT (Itaú Unibanco)</strong></p></div>
            `,
            'cat certifications.log': `
                <div class="mb-2"><p><span class="highlight">[AWS]</span> <a href="https://www.credly.com/badges/d2c8ef5d-dbc0-4821-919a-c6cbc87d4b86/public_url" target="_blank">Solutions Architect - Associate</a></p></div>
                <div class="mb-2"><p><span class="highlight">[AWS]</span> <a href="https://www.credly.com/badges/40defd87-f9b7-4eae-bbaf-7fa2e3c3af2a/public_url" target="_blank">Developer - Associate</a></p></div>
                <div class="mb-2"><p><span class="highlight">[Oracle]</span> <a href="https://www.credly.com/badges/e3e79368-5c6c-4918-b80d-8e87b1870a0d/public_url" target="_blank">Certified Programmer - Java 8</a></p></div>
                <div><p><span class="highlight">[Oracle]</span> <a href="https://www.credly.com/badges/78a84f90-3b07-4ddf-b316-2e10465ec272/public_url" target="_blank">Certified Associate - Java 8</a></p></div>
            `,
            'echo $CONTACT': `
                <ul class="list-inside flex flex-wrap gap-x-4">
                    <li><a href="mailto:jpsacheti@gmail.com" target="_blank">Email: jpsacheti@gmail.com</a></li>
                    <li><a href="https://www.linkedin.com/in/jpsacheti" target="_blank">LinkedIn</a></li>
                    <li><a href="https://github.com/jpsacheti" target="_blank">GitHub</a></li>
                </ul>
            `
        };
        const autoRunCommands = ['help', 'whoami', 'ls -l skills', 'cat experience.log', 'cat certifications.log', 'echo $CONTACT'];
        let autoRunIndex = 0;

        const executeCommand = (cmd) => {
            const historyEntry = document.createElement('div');
            historyEntry.innerHTML = `<div class="prompt flex items-center"><span class="user">${user}@${machine}</span><span class="text-gray-500">:</span><span class="text-blue-400">~</span><span class="arrow font-bold mx-1">$</span><span class="ml-2">${cmd}</span></div>`;
            historyContainer.appendChild(historyEntry);

            const output = document.createElement('div');
            output.className = 'output mb-4';

            if (cmd === 'clear') {
                historyContainer.innerHTML = '';
                return;
            }

            output.innerHTML = commands[cmd] || `<p>command not found: ${cmd}.</p>`;
            historyContainer.appendChild(output);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        };

        function typeCommand(item, onComplete) {
            const commandText = item;
            const promptElement = document.createElement('div');
            promptElement.className = 'prompt mb-2 flex items-center';
            promptElement.innerHTML = `<span class="user">${user}@${machine}</span><span class="text-gray-500">:</span><span class="text-blue-400">~</span><span class="arrow font-bold mx-1">$</span> <span class="command-text"></span>`;
            historyContainer.appendChild(promptElement);
            
            const commandElement = promptElement.querySelector('.command-text');
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            commandElement.appendChild(cursor);

            let i = 0;
            const typingInterval = setInterval(() => {
                if (i < commandText.length) {
                    commandElement.insertBefore(document.createTextNode(commandText.charAt(i)), cursor);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    commandElement.removeChild(cursor);
                    promptElement.querySelector('.command-text').textContent = ` ${commandText}`; // Add space
                    const outputElement = document.createElement('div');
                    outputElement.className = 'output mb-4';
                    outputElement.innerHTML = commands[commandText];
                    historyContainer.appendChild(outputElement);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    onComplete();
                }
            }, 60);
        }

        function processQueue() {
            if (autoRunIndex < autoRunCommands.length) {
                typeCommand(autoRunCommands[autoRunIndex], () => {
                    autoRunIndex++;
                    setTimeout(processQueue, 400);
                });
            } else {
                interactivePrompt.style.display = 'flex';
                input.focus();
            }
        }

        input.addEventListener('keydown', (e) => {
            const cmd = input.value.trim();
            if (e.key === 'Enter') {
                e.preventDefault();
                if (cmd) {
                    commandHistory.push(cmd);
                    historyIndex = commandHistory.length;
                    executeCommand(cmd);
                    input.value = '';
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const partialCmd = input.value.trim();
                const possibleCmd = Object.keys(commands).find(c => c.startsWith(partialCmd));
                if (possibleCmd) input.value = possibleCmd;
            }
        });

        window.onload = () => {
            processQueue();
        };
    </script>
</body>
</html>
